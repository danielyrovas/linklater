name: Release
on:
  push:
    tags:
      - '*'
      - '!*-*'
jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          name: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE=$(grep 'app-version-code' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          gh release create "$RELEASE_VERSION" linklater-release.apk \
            --verify-tag \
            --title "Release $RELEASE_VERSION" \
            --latest \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$CODE.txt"
